<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Favicons can't read the page's CSS, so these colours copy the accent and
       on-accent tokens in src/styles/tokens.css. scripts/make-icons.cjs draws the
       app icons from this file. (No double hyphens in XML comments.) -->
  <style>
    .tile { fill: #7a2e5c; }
    .vine { fill: none; stroke: #9f5a87; stroke-width: 2.4; stroke-linecap: round; }
    .leaf { fill: #9f5a87; }
    .label { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #e59ac4; }
      .vine { stroke: #c97aa8; }
      .leaf { fill: #c97aa8; }
      .label { fill: #161015; }
    }
  </style>
  <rect class="tile" width="100" height="100" rx="22"/>
  <g aria-hidden="true">
    <path class="vine" d="M-4 76 C 12 62, 24 86, 42 76 S 70 54, 104 66"/>
    <path class="vine" d="M20 -4 C 10 12, 32 22, 22 40"/>
    <path class="vine" d="M70 -4 C 74 10, 90 14, 104 6"/>
    <path class="vine" d="M82 104 C 88 90, 70 84, 80 70"/>
    <ellipse class="leaf" cx="12" cy="68" rx="5" ry="2.3" transform="rotate(-35 12 68)"/>
    <ellipse class="leaf" cx="36" cy="79" rx="5" ry="2.3" transform="rotate(25 36 79)"/>
    <ellipse class="leaf" cx="64" cy="61" rx="5" ry="2.3" transform="rotate(-30 64 61)"/>
    <ellipse class="leaf" cx="92" cy="64" rx="5" ry="2.3" transform="rotate(15 92 64)"/>
    <ellipse class="leaf" cx="25" cy="14" rx="5" ry="2.3" transform="rotate(55 25 14)"/>
    <ellipse class="leaf" cx="17" cy="31" rx="5" ry="2.3" transform="rotate(-50 17 31)"/>
    <ellipse class="leaf" cx="84" cy="11" rx="5" ry="2.3" transform="rotate(-20 84 11)"/>
    <ellipse class="leaf" cx="77" cy="86" rx="5" ry="2.3" transform="rotate(50 77 86)"/>
  </g>
  <text class="label" font-family="'IBM Plex Sans', system-ui, sans-serif" font-size="30" font-weight="600" letter-spacing="-1" text-anchor="middle">
    <tspan x="50" y="46">Afro</tspan>
    <tspan x="50" y="74">Tech</tspan>
  </text>
</svg>
